[project]
name = "agent-factory"
version = "0.1.0"
description = "Automated validation pipeline for LLM-generated Python micro-agents (walking skeleton / MVP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bobur Yusupov" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agent-factory = "agent_factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
